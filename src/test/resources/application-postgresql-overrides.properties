# override the default values in application-postgresql.properties for the tests that require them

# PrometheusServiceUnhappyIntegrationTest
tailormap-api.prometheus-api-url=http://localhost:9091/unhappy-path/

# GeoServiceProxyControllerDefaultProxyConfigIntegrationTest
tailormap-api.proxy.passthrough.hostnames=
tailormap-api.proxy.passthrough.layerpatterns=

# UnreachableSolrAdminControllerIntegrationTest
tailormap-api.solr-url=http://localhost:9999/solr

# LayerExtractControllerRestrictedFormatsIntegrationTest
tailormap-api.extract.allowed-outputformats=csv,shape

# UniqueValuesControllerReConfiguredIntegrationTest
tailormap-api.unique.use_geotools_unique_function=false

# ViewerControllerWithActuatorIntegrationTest, ActuatorSecurityConfigurationIntegrationTest
# and IngestMetricsControllerIntegrationTest
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.access=read_only
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.prometheus.metrics.export.descriptions=true
# disable mail, because we don't have an SMTP service in this test
management.health.mail.enabled=false
